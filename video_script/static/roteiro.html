<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video_script — Roteiro</title>
<link rel="stylesheet" href="/shared/shell.css">
<link rel="stylesheet" href="/static/vs.css">
</head>
<body class="page">

<main>
  <div>
    <h1>Roteiro</h1>
  </div>

  <div class="cols">
    <div class="pilha">
      <section class="card">
        <header><h2>Novo roteiro</h2></header>
        <div class="field">
          <span class="lbl">Nome</span>
          <input id="nName" type="text">
        </div>
        <div class="row end"><button class="btn primary" id="nCriar">Criar</button></div>
      </section>

      <section class="card">
        <header>
          <h2>Roteiros</h2>
        </header>
        <div class="list" id="lista"></div>
        <p class="note hidden" id="vazio">Nenhum roteiro ainda.</p>
      </section>
    </div>

    <div class="pilha hidden" id="det">
      <!-- --------------------------------------------------------- cabeçalho -->
      <section class="card">
        <header>
          <h2 id="dNome">—</h2>
        </header>
        <div class="field">
          <span class="lbl">Nome do roteiro</span>
          <input id="dNomeIn" type="text">
        </div>
      </section>

      <!-- ----------------------------------------------------- participantes -->
      <section class="card">
        <header>
          <h2>Quem joga</h2>
        </header>
        <div class="list" id="dParts"></div>
        <div class="row">
          <button class="btn small" id="dAddPart">+ participante</button>
        </div>
      </section>

      <!-- ------------------------------------------------------------ jogos -->
      <section class="card">
        <header>
          <h2>Jogos do roteiro</h2>
        </header>
        <div class="list" id="dJogos"></div>
        <p class="note hidden" id="dJogosVazio">Nenhum jogo ainda. Escolha um
          tipo abaixo.</p>
        <div class="field">
          <span class="lbl">Adicionar jogo</span>
          <div class="chips" id="dTipos"></div>
        </div>
      </section>

      <div class="row end">
        <button class="btn danger" id="dApagar">Apagar roteiro</button>
        <button class="btn primary" id="dSalvar">Salvar</button>
        <button class="btn" id="dJogar">Jogar roteiro →</button>
      </div>
    </div>
  </div>
</main>

<script src="/static/vs.js"></script>
<script src="/static/roteiro.js"></script>
</body>
</html>
